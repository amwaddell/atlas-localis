name: Model-free checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      LANGSMITH_TRACING: 'false'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - name: Set Hugging Face cache directory
        shell: bash
        run: echo "HF_HOME=$RUNNER_TEMP/empty-hf" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact model-free development environment
        run: |
          python -m pip install --only-binary=:all: --no-deps -r locks/ci-py312.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Checks (also run locally)
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check tests src/workbench/evaluation scripts/run_researcher_eval.py
          python scripts/run_researcher_eval.py --validate-only
          python -m pytest -o addopts='' --strict-markers -m 'not acceptance and not integration' -q
          python -m pytest -o addopts='' --strict-markers -m fixture_integration -q
          git diff --check
