# Default configuration for agentic workbench

# Model server settings
model:
  provider: "llamacpp_server"
  base_url: "http://127.0.0.1:8080"
  model_name: "ministral-3-8b-instruct"
  temperature: 0.7
  max_tokens: 2048
  timeout_seconds: 60

# Cached in-process E5; semantic identity is independent of optional model_path.
embeddings:
  provider: "local"
  model_name: "intfloat/multilingual-e5-base"
  batch_size: 4
  device: "mps"  # CPU only when Metal is unavailable; no error-time retry

# Retrieval settings
retrieval:
  strategy: "hybrid"
  keyword_top_k: 20
  vector_top_k: 20
  merge_top_n: 50
  rrf_k: 60
  final_top_k: 5

# Full BGE window preserves measured HTTP ranking; batches of one bound memory.
# Enabled preserves the baseline; canonical answer quality remains an acceptance gate.
reranking:
  enabled: true
  provider: "cross_encoder"
  model_name: "BAAI/bge-reranker-v2-m3"
  device: "mps"
  batch_size: 1
  max_length: 8192

# Context builder settings
context:
  prompt_tokens: 6000  # includes output, schema, framing and repair reserve
  output_tokens: 1200
  max_chunks_per_doc: 3

# Chunking settings
chunking:
  strategy: "paragraph_aware"
  target_size: 1000  # characters; matches existing chunks_manifest.yaml
  max_size: 1500
  min_chunk_size: 100

# Data paths
paths:
  data_dir: "./data"
  raw_data: "./data/raw"
  processed_data: "./data/processed"
  indexes_dir: "./data/indexes"
  active_index: "./data/indexes/active"
  index_snapshots: "./data/indexes/snapshots"

# Run settings
runs:
  output_dir: "./runs"
  logs_dir: "./runs/logs"
  traces_dir: "./runs/traces"
  reports_dir: "./runs/reports"

# Observability
observability:
  enable_tracing: true
  enable_metrics: true
  phoenix_endpoint: "http://127.0.0.1:6006"
  log_level: "INFO"
  